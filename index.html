<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>擂台选车助手</title>
    <script src="config.js"></script>
    <script src="app_state.js"></script>
    <script src="api.js"></script>
    <script src="allocator.js"></script>
    <script src="race_scores.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="card">
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box">
            <div class="loading-spinner"></div>
            <p>计算最优方案...</p>
        </div>
    </div>

    <h1>擂台选车助手</h1>
    <div class="sub">帕累托最优 · 擂台选车</div>
    <div class="mode-controls">
    <nav class="toggle-group server-switch" aria-label="游戏服务器">
        <a class="toggle-choice active" id="serverCnLink" href="?server=cn">国服</a>
        <a class="toggle-choice inactive" id="serverGlobalLink" href="?server=global">国际服</a>
    </nav>
    <!-- 档位切换 -->
    <div class="toggle-group" id="tierToggle">
        <label data-tier="理论" class="inactive">理论档</label>
        <label data-tier="高手" class="active">高手档</label>
        <label data-tier="普通" class="inactive">普通档</label>
        <label data-tier="自动" class="inactive">自动档</label>
    </div>

    <div class="toggle-group" id="zoneToggle">
        <label data-zone="zone5" class="active">五区</label>
        <label data-zone="zone4" class="inactive">四区</label>
    </div>
    </div>
    <p class="server-note" id="serverNote" hidden></p>
    <p id="storageNotice" role="status" hidden style="color:#ffb86c;"></p>

    <div class="map-rows" id="mapRowsContainer"></div>

    <details class="garage" id="garagePanel" open>
        <summary class="garage-header">
            <h2 id="garageTitle">我的车库</h2>
            <span class="garage-fold-label" aria-hidden="true"></span>
        </summary>
        <div class="garage-body">
            <div class="garage-actions">
                <div class="garage-action-group" role="group" aria-label="保存与恢复车库">
                    <button type="button" id="garageSaveBtn">保存车库</button>
                    <button type="button" id="garageRestoreBtn">恢复已保存</button>
                </div>
                <div class="garage-action-group" role="group" aria-label="临时选车与排序">
                    <button type="button" class="garage-btn" id="selectAllBtn">全部点亮</button>
                    <button type="button" class="garage-btn" id="clearAllBtn">全部清空</button>
                    <button type="button" class="garage-btn" id="sortBtn">默认</button>
                </div>
                <span id="garageSaveStatus" role="status">手动保存 · 临时选择不会覆盖车库</span>
            </div>
        <div class="zone-hint" id="zoneHint">星级代表加速所改装的星级，仅作为参考</div>
        <input class="garage-search" id="garageSearch" type="text" placeholder="搜索车辆(支持昵称/真名)..." autocomplete="off">
        <div class="class-filter" id="classFilter">
            <span class="class-filter-btn active" data-class="">全部</span>
            <span class="class-filter-btn" id="classFilterR" data-class="R">R</span>
            <span class="class-filter-btn" data-class="S">S</span>
            <span class="class-filter-btn" data-class="A">A</span>
            <span class="class-filter-btn" data-class="B">B</span>
            <span class="class-filter-btn" data-class="C">C</span>
            <span class="class-filter-btn" data-class="D">D</span>
        </div>
        <div class="car-grid" id="carGrid"></div>
        </div>
    </details>

    <div class="action">
        <button class="recommend-btn" id="recommendBtn">生成方案</button>
    </div>

    <div class="result-panel">
        <div class="result-title">
            方案
            <span class="badge-pareto" id="schemeCountBadge">0</span>
        </div>
        <div class="scheme-selector">
            <select id="schemeSelect" aria-label="选择方案"></select>
        </div>
        <div class="sc-panel" id="scPanel" style="display:none;margin-bottom:14px;padding:10px 14px;background:#0d1117;border-radius:10px;border:1px solid #21262d;">
            <div style="color:#8b949e;font-size:0.8rem;margin-bottom:8px;">特殊跑法</div>
            <div id="scToggleList" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
        </div>
        <div class="result-grid" id="resultGrid"></div>
    </div>
    <footer class="site-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">粤ICP备2026156614号-1</a>
    </footer>
</div>

<script>
(function() {
/** ====================================================================
 *  架构概览
 *    1) 数据层 —— data.json（赛道+优先级）+ cars.json（性能+昵称映射）
 *    2) UI 层  —— 动态渲染地图行、车库网格、结果面板
 *    3) 算法层  —— 回溯枚举分配 → 帕累托非支配排序
 *    4) 持久化  —— 通过 api.js 统一接入（static→localStorage / api→服务器）
 * ===================================================================== */

    // 当前模式: 'zone5' | 'zone4'
    let currentZone = 'zone5';
    // 当前档位: '理论' | '高手' | '普通' | '自动'
    let currentTier = APP_CONFIG.server === 'global' ? '理论' : '高手';

    let RACE_DATA = null;
    let bigMapList = [];
    let smallMapsByBig = {};

    // ===================== 五区 / 四区 车池与星级规则 =====================
    // 唯一来源是 cars.json 里每辆车记录上的 `zones`（车池）与 `star_rule`（星级上下限）。
    // 前端与 Python 校验（validate_data.py）读同一份定义，避免两侧规则分叉；
    // 增删车辆、调整星级限制都改 cars.json，不要在本文件里再维护副本。
    // 以下变量由 buildCarRules() 在 cars.json 加载后填充。
    let zone5Cars = [];
    let zone4Cars = [];

    // 车辆度量数据 (cars.json 动态加载后填充)
    let carStats = {};         // 真车名 → { score, max_speed, ... }
    let nickToName = {};       // 昵称 → 真车名
    let sortMode = 'alpha';    // 'alpha' | 'score-desc' | 'score-asc'
    let filterClass = null;    // null = 全部, 或 'S','A','B','C','D','R' 之一

    // DOM 元素
    const mapRowsContainer = document.getElementById('mapRowsContainer');
    const carGrid = document.getElementById('carGrid');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const recommendBtn = document.getElementById('recommendBtn');
    const schemeSelect = document.getElementById('schemeSelect');
    const resultGrid = document.getElementById('resultGrid');
    const schemeCountBadge = document.getElementById('schemeCountBadge');
    const loadingOverlay = document.getElementById('loadingOverlay');

    const ROWS = 5;

    let bigSelects = [];
    let smallSelects = [];
    let topCarPanels = [];

    let ocMap = {};
    let ocAvailable = new Set();
    let selectedCars = new Set();            // 车库拥有车辆
    let searchQuery = '';                    // 车库搜索关键字
    let currentBestSchemes = [];             // 非支配方案列表 { assignment, vector }
    // 特殊跑法状态: mapKey('大地图/小地图') → 'all' / 'off' / sc_type
    let specialRouteEnabled = {};

    const storageFailures = new Map();
    function storageResult(key, error) {
        if (error) storageFailures.set(key, error);
        else storageFailures.delete(key);
        const notice = document.getElementById('storageNotice');
        notice.hidden = storageFailures.size === 0;
        notice.textContent = [...storageFailures.values()].join('；');
    }
    function savePreference(key, value) {
        try {
            api.savePref(key, value);
            storageResult(key, null);
        } catch (error) {
            storageResult(key, '设置未能保存，刷新后可能丢失');
        }
    }
    function getRouteState(big, small, zone = currentZone) {
        const track = RACE_DATA?.tracks?.find(t => t.大地图 === big && t.小地图 === small);
        const entries = track?.[zone === 'zone4' ? '四区' : '五区']?.[currentTier] || [];
        const available = [...new Set(entries.filter(e => e.sc).map(e => e.sc_type))];
        const mapKey = big + '/' + small;
        const normalized = appState.route(specialRouteEnabled[mapKey], available);
        specialRouteEnabled[mapKey] = normalized;
        return normalized;
    }

    // ========================== 星级自定义 ==========================

    /**
     * 每辆车的星级规则（来源：cars.json 每辆车记录上的 `star_rule`）。
     * - min: 最低可用星级（四区/五区均适用）
     * - max: 全局最高可用星级（未指定则 6）
     * - zone4Max: 四区模式最高可用星级（未指定则沿用 max）
     * - default: 默认星级（未设 starsMap 时使用）
     *
     * 由 buildCarRules() 填充；前端与 Python 校验共用同一份定义。
     */
    let CAR_STAR_RULES = {};

    /** 获取某辆车的星级规则，未配置则无限制 */
    function getStarRule(carName) {
        return CAR_STAR_RULES[carName] || null;
    }

    /**
     * 由 cars.json 派生车池与星级规则（唯一来源，页面内不再维护副本）。
     *
     * 每辆车记录上：
     *   `zones`     → 参与的分区车池，如 ["五区","四区"]
     *   `star_rule` → 星级限制，键与下方 getStarRange 一致
     *
     * 必须在 carStats / nickToName 就绪之后、loadGarage() 之前调用。
     */
    function buildCarRules() {
        zone5Cars = [];
        zone4Cars = [];
        CAR_STAR_RULES = {};
        for (const car of Object.values(carStats)) {
            if (!car.nickname) continue;          // nickname 即数据里的车名（唯一索引）
            const zones = car.zones || [];
            if (zones.includes('五区')) zone5Cars.push(car.nickname);
            if (zones.includes('四区')) zone4Cars.push(car.nickname);
            if (car.star_rule) CAR_STAR_RULES[car.nickname] = car.star_rule;
        }
        if (zone5Cars.length === 0 || (APP_CONFIG.server !== 'global' && zone4Cars.length === 0) || Object.keys(CAR_STAR_RULES).length === 0) {
            throw new Error('cars.json 缺少 zones / star_rule 定义，无法构建车池与星级规则');
        }
    }

    /** 获取某辆车的当前有效星级范围 */
    function getStarRange(carName) {
        var rule = getStarRule(carName);
        if (!rule) return { min: 1, max: 6 };
        var max = rule.max || 6;
        if (currentZone === 'zone4' && rule.zone4Max != null) {
            max = rule.zone4Max;
        }
        return { min: rule.min || 1, max: Math.max(max, rule.min || 1) };
    }

    /** 获取某辆车的默认星级 */
    function getDefaultStar(carName) {
        var rule = getStarRule(carName);
        if (rule && rule.default != null) return rule.default;
        return 6;
    }

    /** 用户为每辆车设定的星级映射（持久化） */
    let starsMap = {};

    // 星级曲线与独立跑法估算位于 race_scores.js；参数和取整保持不变。

    /** 加载已保存的星级映射 */
    function loadStarsMap() {
        try {
            const saved = (globalThis.RACEPICK_SERVER !== 'global' && globalThis.accountUI?.active()) ? accountUI.stars() : api.loadPref(APP_CONFIG.storageKeys.starMap);
            if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
                starsMap = saved;
            }
        } catch (e) { /* 静默忽略 */ }
    }

    /** 保存星级映射 */
    function saveStarsMap() {
        if ((globalThis.RACEPICK_SERVER !== 'global' && globalThis.accountUI?.active())) {
            try {
                accountUI.saveStars(starsMap);
                storageResult(APP_CONFIG.storageKeys.starMap, null);
            } catch (error) {
                storageResult(APP_CONFIG.storageKeys.starMap, '星级未能保存，请等待账号操作结束后重试');
            }
        } else stageGuestGarage();
        updateGarageSaveStatus();
    }

    /** 用户未设置时的分区默认星级：五区=最高星，四区=规则默认值 */
    function getZoneDefaultStar(carName) {
        if (currentZone === 'zone5') return getStarRange(carName).max;
        return getDefaultStar(carName);
    }

    /** 获取当前分区的有效星级，不改写保存的用户设置（显示与计算共用同一来源） */
    function getCarStars(carName) {
        if (globalThis.RACEPICK_SERVER === 'global') return getStarRange(carName).max;
        const saved = starsMap[carName];
        const stars = Number.isInteger(saved) && saved >= 1 && saved <= 6
            ? saved : getZoneDefaultStar(carName);
        const range = getStarRange(carName);
        return Math.max(range.min, Math.min(range.max, stars));
    }

    /** 获取某辆车的初始显示星级（与 getCarStars 一致） */
    function getInitCarStars(carName) {
        return getCarStars(carName);
    }

    /** 设置星级，自动钳位到有效范围 */
    function setCarStars(carName, stars) {
        if (APP_CONFIG.server === 'global') return getCarStars(carName);
        var range = getStarRange(carName);
        var clamped = Math.max(range.min, Math.min(range.max, stars));
        starsMap[carName] = clamped;
        saveStarsMap();
        return clamped;
    }

    // ========================== 工具函数 ==========================

    /**
     * 将 gauntlet_data.json 的新格式条目转换为旧格式 ([carName] 数组)。
     * 新格式: {"cars": [{"name": "杰皇"}, ...], "time": 123, "sc": true}
     * 旧格式: ["杰皇"]  或  ["杰皇", 123]
     * 同时返回原始 entry 对象供成绩查询（保留 time、sc 等字段）。
     */
    function normalizeEntry(entry) {
        if (entry && entry.cars) {
            // 2026-09-02: 数据已确认全单车条目（多选一格式余留删除），取首车即可
            if (entry.cars.length > 1) console.warn('多车条目不再支持:', entry);
            const result = [entry.cars[0].name];  // 车名
            if (entry.time != null) result.push(entry.time);
            result._raw = entry;  // 挂载原始对象供后续读取
            return result;
        }
        return entry;  // 已经是旧格式
    }

    /**
     * 从当前档位中提取五区/四区的原始车组列表（转换为旧格式）。
     * 保留原始数据顺序；推荐排序统一由 getOriginalGroups 按有效成绩决定。
     */
    function getTierEntries(track, zone) {
        const tierData = track[zone]?.[currentTier];
        if (!tierData || !Array.isArray(tierData)) return [];
        return tierData.map(normalizeEntry);
    }

    /**
     * 解析车组条目，取第一元素作为车名。
     * @param {string|string[]|Object} cell - 一条选车数据
     * @returns {string[]} 车名数组
     */
    function parseCarGroup(cell) {
        if (Array.isArray(cell)) {
            return [String(cell[0])];
        }
        if (typeof cell === 'string') {
            return [cell];
        }
        return ['?'];
    }

    /** 获取当前模式的车列表 */
    function getCurrentCarList() {
        return currentZone === 'zone4' ? zone4Cars : zone5Cars;
    }

    /**
     * 纯函数：按搜索关键字过滤车辆列表（支持昵称和真车名）。
     * @param {string[]} carList - 车昵称列表
     * @param {string} query - 搜索关键字
     * @returns {string[]} 过滤结果
     */
    /** 昵称别名映射：不同叫法指向同一辆车 */
    const NICKNAME_ALIASES = {
        '第六元素': '六子',
        '兔子': 'c2',
    };

    function filterBySearch(carList, query) {
        if (!query) return [...carList];
        const q = query.toLowerCase();
        return carList.filter(car => {
            if (car.includes(query)) return true;
            if (nickToName[car] && nickToName[car].toLowerCase().includes(q)) return true;
            // 别名匹配：查所有指向此车的别名键
            for (var aliasKey in NICKNAME_ALIASES) {
                if (NICKNAME_ALIASES[aliasKey] === car && aliasKey.includes(query)) return true;
            }
            return false;
        });
    }

    /**
     * 纯函数：按性能等级过滤车辆列表。
     * @param {string[]} carList - 车昵称列表
     * @param {string|null} cls - 等级标识 'S'|'A'|'B'|'C'|'D'|'R' 或 null（全部）
     * @returns {string[]}
     */
    function filterByClass(carList, cls) {
        if (!cls) return [...carList];
        return carList.filter(car => {
            const stats = carStats[nickToName[car]];
            return stats && stats.class === cls;
        });
    }

    /**
     * 纯函数：对车辆列表排序。
     * @param {string[]} carList - 车昵称列表
     * @param {string} mode - 'alpha' | 'score-desc' | 'score-asc'
     * @returns {string[]} 排序后的新数组
     */
    function sortCarList(carList, mode) {
        const sorted = [...carList];
        if (mode === 'score-desc' || mode === 'score-asc') {
            sorted.sort((a, b) => {
                const left = carStats[nickToName[a]]?.score, right = carStats[nickToName[b]]?.score;
                const leftKnown = Number.isFinite(left), rightKnown = Number.isFinite(right);
                if (leftKnown !== rightKnown) return leftKnown ? -1 : 1;
                if (!leftKnown) return a.localeCompare(b, 'zh');
                return mode === 'score-desc' ? right - left : left - right;
            });
        } else {
            sorted.sort((a, b) => a.localeCompare(b, 'zh'));
        }
        return sorted;
    }

    // ========================== 数据加载与索引 ==========================

    // 车池与星级规则由 cars.json 的 zones / star_rule 派生，见 buildCarRules()

    // 构建地图索引（从 gauntlet_data.json 读取，按当前档位获取数据）
    function buildMapIndex() {
        if (!RACE_DATA || !RACE_DATA.tracks) return;
        const bigSet = new Set();
        const map = {};
        RACE_DATA.tracks.forEach(item => {
            const big = item.大地图;
            const small = item.小地图;
            const zone5Entries = getTierEntries(item, '五区');
            const zone4Entries = getTierEntries(item, '四区');
            const orderGroups = zone5Entries.map(entry => parseCarGroup(entry));
            const zone4OrderGroups = zone4Entries.map(entry => parseCarGroup(entry));
            bigSet.add(big);
            if (!map[big]) map[big] = [];
            map[big].push({
                name: small,
                orderGroups,
                zone4OrderGroups,
                zone5Entries,   // 保留原始数据供成绩查询
                zone4Entries
            });
        });
        // 保持原始顺序
        bigMapList = Array.from(bigSet);
        smallMapsByBig = map;
    }

    /**
     * 查询某辆车在某小地图上的具体成绩。
     * gauntlet_data.json 中使用 time 字段存储成绩。
     * @param {string} big - 大地图名
     * @param {string} small - 小地图名
     * @param {string} carName - 车昵称
     * @param {string} zone - 'zone5' | 'zone4'
     * @returns {number|string|null} 成绩值，或 null
     */
    function getCarScore(big, small, carName, zone) {
        const found = smallMapsByBig[big]?.find(item => item.name === small);
        if (!found) return null;
        const entries = zone === 'zone4' ? found.zone4Entries : found.zone5Entries;
        const routeState = getRouteState(big, small, zone);
        return raceScores.effectiveTime(entries, carName, currentTier, getCarStars(carName), routeState, null, {ocMap});
    }

    // ========================== 界面渲染 ==========================

    // 渲染地图行
    function renderMapRows() {
        mapRowsContainer.innerHTML = '';
        bigSelects = [];
        smallSelects = [];
        topCarPanels = [];
        for (let i = 0; i < ROWS; i++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'map-row';
            rowDiv.innerHTML = `
                <div class="map-index">${i+1}</div>
                <div class="map-select-group">
                    <div class="select-wrapper">
                        <label>大地图</label>
                        <select class="big-map-select" data-index="${i}"></select>
                    </div>
                    <div class="select-wrapper">
                        <label>小地图</label>
                        <select class="small-map-select" data-index="${i}" disabled></select>
                    </div>
                    <details class="track-top-cars" hidden>
                        <summary>查看本图前三可用车</summary>
                        <p class="track-top-note">单图参考，未扣除其他图用车。成绩沿用当前档位与星级口径。</p>
                        <ol class="track-top-list"></ol>
                        <p class="track-top-empty" hidden>当前车库下无可用车</p>
                    </details>
                </div>
            `;
            mapRowsContainer.appendChild(rowDiv);
            const bigSel = rowDiv.querySelector('.big-map-select');
            const smallSel = rowDiv.querySelector('.small-map-select');
            bigSelects.push(bigSel);
            smallSelects.push(smallSel);
            topCarPanels.push(rowDiv.querySelector('.track-top-cars'));
        }
    }

    /** 候选已按页面口径排序；单图参考不扣除其他图分配的车。 */
    function getTopCars(candidate, ownedInZone, big, small, zone) {
        const cars = [...new Set(candidate.groups.flat())].filter(car => ownedInZone.has(car)).slice(0, 3);
        return cars.map(car => ({
            car,
            stars: currentTier === '理论' ? null : getCarStars(car),
            score: getCarScore(big, small, car, zone),
        }));
    }

    /** 保留同图的展开状态；换图、清空后重新默认折叠。只更新内容，不触发求解。 */
    function renderTopCars(validMaps, candidates, ownedInZone) {
        topCarPanels.forEach((panel, row) => {
            const index = validMaps.findIndex(map => map.originalIndex === row);
            const map = validMaps[index];
            const key = map ? JSON.stringify([map.big, map.small]) : '';
            if (panel.dataset.mapKey !== key) panel.open = false;
            panel.dataset.mapKey = key;

    // =======================================================================
    //  核心算法
    //  三步法：
    //    1) 预计算每张图的候选车组 + 车→优先级映射
    //    2) 回溯枚举所有可行的不重复分配
    //    3) 帕累托非支配过滤，保留不可被全面超越的方案
    // =======================================================================

    /**
     * 计算某车在某图某区档下、用于排序的有效成绩。
     * - 高手档：用 getStarAdjustedScore 按用户星级调整（与展示层一致）
     * - 理论档：取最高星数据点（默认满星）
     * scOnly=true 时只取 sc 条目，false 时只取普通条目。
     * 返回 null 表示该车无可用成绩（不参与排序，排在末尾）。
     */
    function getEffectiveTime(entries, carName, scOnly, zone) {
        return raceScores.effectiveTime(entries, carName, currentTier, getCarStars(carName), 'all', scOnly, {ocMap});
    }

    /**
     * 获取某地图的选车推荐组。
     * 组索引 = 优先级等级（越小越优）。
     *
     * 排序规则（2026-09-21 起）：完全按有效成绩升序决定组序。
     *  - 开关关闭：只用普通跑法成绩排序，sc 条目全部忽略。
     *  - 开关打开：sc 成绩作为该车的候选成绩参与比较，取更快的那条参与排序；
     *    sc 类型筛选仍生效（指定类型时只用该类型的 sc）。
     * 无成绩的车按原数据顺序附在末尾。
     */
    function getOriginalGroups(big, small, zone) {
        const list = smallMapsByBig[big];
        if (!list) return null;
        const found = list.find(item => item.name === small);
        if (!found) return null;

        var mapKey = big + '/' + small;
        var scState = getRouteState(big, small, zone);
        var scOn = scState !== 'off';

        // 选择五区或四区的数据
        const entries = zone === 'zone4' ? found.zone4Entries : found.zone5Entries;

        // sc 类型过滤后的可用条目（关闭时剔除全部 sc）
        var usable = [];
        for (var ei = 0; ei < entries.length; ei++) {
            var raw = entries[ei]._raw;
            if (!raw) continue;
            const entryOc = raw.cars?.[0]?.oc;
            if ((entryOc === undefined ? false : entryOc) !== (ocMap[raw.cars?.[0]?.name] === true)) continue;
            if (!scOn && raw.sc) continue;
            if (scOn && scState !== 'all' && raw.sc && raw.sc_type !== scState) continue;
            usable.push(entries[ei]);
        }

        // 收集候选车（保持原数据出现顺序，作为并列时与无成绩时的稳定序）
        var cars = [];
        var seen = {};
        for (var k = 0; k < usable.length; k++) {
            var name = parseCarGroup(usable[k])[0];
            if (!name) continue;
            if (seen[name] === undefined) { seen[name] = cars.length; cars.push(name); }
        }

        // 每车取「可用的最快成绩」：开关打开时普通与 sc 一起比，谁快用谁
        var scored = cars.map(function(carName) {
            var normal = getEffectiveTime(usable, carName, false, zone);
            var sc = scOn ? getEffectiveTime(usable, carName, true, zone) : null;
            var best = normal;
            if (sc != null && (best == null || sc < best)) best = sc;
            return { car: carName, time: best };
        });

        // 有成绩的按成绩升序；无成绩的按原顺序附在末尾
        var withTime = scored.filter(function(s) { return s.time != null; });
        var noTime = scored.filter(function(s) { return s.time == null; });
        withTime.sort(function(a, b) { return a.time - b.time; });

        return withTime.concat(noTime).map(function(s) { return [s.car]; });
    }
    /** 默认无车优先级标记（100 以内，远大于实际优先级值） */
    const NO_CAR_PRIORITY = 99;

    /** 页面层：按选定地图和分区准备候选车组及原始优先级。 */
    function prepareMapCandidates(validMaps, zone) {
        const n = validMaps.length;
        // 1. 预计算每张图的数据:候选组、车→优先级映射
        const mapsData = [];
        for (let i = 0; i < n; i++) {
            const { big, small } = validMaps[i];
            const originalGroups = getOriginalGroups(big, small, zone);
            if (!originalGroups) {
                // 无数据的地图，标记为空
                mapsData.push({ groups: [], carToPriority: new Map() });
                continue;
            }

            // 过滤候选:每组只保留拥有的车
            // 车->优先级 (组索引)
            const carToPriority = new Map();
            for (let gIdx = 0; gIdx < originalGroups.length; gIdx++) {
                const group = originalGroups[gIdx];
                for (const car of group) {
                    if (!carToPriority.has(car)) {
                        carToPriority.set(car, gIdx);
                    }
                }
            }
            mapsData.push({ groups: originalGroups, carToPriority });
        }

        return mapsData;
    }

    /** 页面层：把紧凑方案映射回显示行，未选地图的位置保留为空。 */
    function mapSchemesToRows(schemes, validMaps, rowCount) {
        return schemes.map(scheme => {
            const assignment = new Array(rowCount).fill(null);
            const vector = new Array(rowCount).fill(null);
            validMaps.forEach(({ originalIndex }, index) => {
                assignment[originalIndex] = scheme.assignment[index];
                vector[originalIndex] = scheme.vector[index];
            });
            return { assignment, vector };
        });
    }

    /** 计算方案的总优先级分（累加所有非空行，越小越优） */
    function getTotalScore(scheme) {
        if (!scheme || !scheme.vector) return 0;
        return scheme.vector.reduce((s, v) => s + (v !== null ? v : 0), 0);
    }

    // 获取当前有效地图列表
    function getCurrentValidMaps() {
        const maps = [];
        for (let i = 0; i < ROWS; i++) {
            const big = bigSelects[i].value;
            const small = smallSelects[i].value;
            if (big && small) {
                maps.push({ big, small, originalIndex: i });
            }
        }
        return maps;
    }



    /** 渲染特殊跑法开关（在结果面板中展示） */
    function getScTypes(track) {
        var zoneKey = currentZone === 'zone4' ? '四区' : '五区';
        var tierData = track[zoneKey]?.[currentTier];
        if (!tierData || !Array.isArray(tierData)) return [];
        var types = {};
        for (var ei = 0; ei < tierData.length; ei++) {
            if (tierData[ei].sc && tierData[ei].sc_type) {
                types[tierData[ei].sc_type] = true;
            }
        }
        return Object.keys(types);
    }

    function renderScToggles() {
        var panel = document.getElementById('scPanel');
        var list = document.getElementById('scToggleList');
        if (!panel || !list) return;
        var hasSc = false;
        var toggleHtml = '';
        for (var i = 0; i < ROWS; i++) {
            var big = bigSelects[i]?.value;
            var small = smallSelects[i]?.value;
            if (!big || !small) continue;
            var mapKey = big + '/' + small;
            var track = RACE_DATA?.tracks?.find(function(t) { return t['大地图'] + '/' + t['小地图'] === mapKey; });
            if (!track || !track.has_special_route) continue;
            var zoneKey = currentZone === 'zone4' ? '四区' : '五区';
            var tierData = track[zoneKey]?.[currentTier];
            var hasScEntries = tierData && Array.isArray(tierData) && tierData.some(function(e) { return e.sc; });
            if (!hasScEntries) continue;
            hasSc = true;
            var note = track.special_route_note || '';
            var currentState = getRouteState(big, small);
            var scTypes = getScTypes(track);

            if (scTypes.length > 1) {
                // 多 sc 类型：显示下拉选择器
                var opts = '';
                opts += '<option value="off"' + (currentState === 'off' ? ' selected' : '') + '>关闭</option>';
                opts += '<option value="all"' + (currentState === 'all' ? ' selected' : '') + '>全部</option>';
                for (var ti = 0; ti < scTypes.length; ti++) {
                    opts += '<option value="' + scTypes[ti] + '"' + (currentState === scTypes[ti] ? ' selected' : '') + '>' + scTypes[ti] + '</option>';
                }
                toggleHtml += '<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:8px;font-size:0.8rem;border:1px solid #21262d;background:#0d1117;color:#e6edf3;">';
                toggleHtml += '<span>' + small + '</span>';
                if (note) toggleHtml += ' <span style="font-size:0.7rem;">(' + note + ')</span>';
                toggleHtml += ' <select class="sc-select" data-mapkey="' + mapKey + '" style="padding:2px 8px;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:0.75rem;cursor:pointer;">' + opts + '</select>';
                toggleHtml += '</span>';
            } else {
                // 单 sc 类型：显示切换开关
                var isOn = currentState !== 'off';
                toggleHtml += '<span class="sc-toggle" data-mapkey="' + mapKey + '" style="display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:8px;font-size:0.8rem;cursor:pointer;border:1px solid ' + (isOn ? '#58a6ff' : '#30363d') + ';background:' + (isOn ? '#1f3a5f' : '#0d1117') + ';color:' + (isOn ? '#58a6ff' : '#6e7681') + ';user-select:none;">' + small + ' <span style="font-size:0.7rem;">' + (note ? '(' + note + ')' : '') + '</span> <span>' + (isOn ? '\u25C9' : '\u25CB') + '</span></span>';
            }
        }
        list.innerHTML = toggleHtml;
        panel.style.display = hasSc ? '' : 'none';
    }

    /** 渲染无可用方案时的空状态 */
    function renderEmptyResult() {
        document.getElementById('scPanel').style.display = 'none';
        let html = '';
        for (let i = 0; i < ROWS; i++) {
            const big = bigSelects[i]?.value;
            const small = smallSelects[i]?.value;
            if (big && small) {
                html += `<div class="result-item"><div class="result-map">${small}</div><div class="result-bigmap">${big}</div><div class="result-car empty">无法分配</div></div>`;
            } else if (bigSelects[i]?.value || smallSelects[i]?.value) {
                html += `<div class="result-item"><div class="result-map">未选完整</div><div class="result-bigmap">--</div><div class="result-car empty">⛔ 缺地图</div></div>`;
            } else {
                html += `<div class="result-item"><div class="result-map">第${i+1}图</div><div class="result-bigmap">未选</div><div class="result-car empty">待选图</div></div>`;
            }
        }
        resultGrid.innerHTML = html;
    }

    /**
     * 渲染单个方案的结果网格。
     * 每列突出车辆、有效星级及成绩；总优先级仅在方案选择中显示。
     */
    function renderResultGrid(scheme) {
        if (!scheme) {
            renderEmptyResult();
            return;
        }
        renderScToggles();

        let html = '';
        for (let i = 0; i < ROWS; i++) {
            const big = bigSelects[i].value;
            const small = smallSelects[i].value;
            if (big && small) {
                const car = scheme.assignment[i];
                if (car) {
                    const score = getCarScore(big, small, car, currentZone);
                    const scoreHtml = score !== null && score !== undefined
                        ? `<div class="result-score">${Number(score).toFixed(2)} <span class="result-unit">秒</span></div>`
                        : '';
                    // 理论档不显示星级（默认满星）
                    const starLevel = getCarStars(car);
                    const starHtml = currentTier !== '理论' ? `<span class="result-stars">★${starLevel}</span>` : '';
                    html += `<div class="result-item">
                        <div class="result-map">${small}</div>
                        <div class="result-bigmap">${big}</div>
                        <div class="result-car">${car}${APP_CONFIG.server === 'global' && ocMap[car] ? ' [OC]' : ''}${starHtml}</div>
                        ${scoreHtml}
                    </div>`;
                } else {
                    html += `<div class="result-item">
                        <div class="result-map">${small}</div>
                        <div class="result-bigmap">${big}</div>
                        <div class="result-car empty">无可用车</div>
                    </div>`;
                }
            } else {
                html += `<div class="result-item">
                    <div class="result-map">第${i+1}位</div>
                    <div class="result-bigmap">未选地图</div>
                    <div class="result-car empty">⛔ 未配置</div>
                </div>`;
            }
        }
        resultGrid.innerHTML = html;
    }

    // 更新下拉菜单及显示
    function updateUIWithSchemes(schemes) {
        currentBestSchemes = schemes;
        schemeSelect.innerHTML = '';
        if (currentBestSchemes.length === 0) {
            const opt = document.createElement('option');
            opt.textContent = '无可分配方案';
            opt.value = '-1';
            schemeSelect.appendChild(opt);
            schemeSelect.disabled = true;
            schemeCountBadge.textContent = '0';
            renderResultGrid(null);
            return;
        }

        schemeSelect.disabled = false;
        schemeCountBadge.textContent = currentBestSchemes.length;
        currentBestSchemes.forEach((scheme, idx) => {
            const totalScore = getTotalScore(scheme);
            const option = document.createElement('option');
            option.value = idx;
            // 方案摘要: 按行号列出各图选车 + 总优先级分（越小越优）
            const parts = [];
            for (let i = 0; i < ROWS; i++) {
                const big = bigSelects[i].value;
                const small = smallSelects[i].value;
                if (big && small) parts.push(`${i+1}:${scheme.assignment[i] || '空'}`);
            }
            option.textContent = `方案${idx+1} · ${parts.join(' ')} · Σ=${totalScore}`;
            schemeSelect.appendChild(option);
        });
        schemeSelect.value = 0;
        renderResultGrid(currentBestSchemes[0]);
    }

    /** 方案数量上限 */
    const SCHEME_LIMIT = 25;

    /**
     * 主控：根据当前地图选择 + 车库状态，生成帕累托最优方案并渲染。
     * 无地图选中时显示提示；有地图时异步计算（延迟一帧给加载动画时间）。
     * 结果按总优先级分升序排列。
     */
    const computation = appState.createScheduler(callback => {
        requestAnimationFrame(() => setTimeout(callback, 0));
    });
    function computationError(error) {
        currentBestSchemes = [];
        schemeSelect.innerHTML = '';
        schemeSelect.disabled = true;
        schemeCountBadge.textContent = '0';
        resultGrid.textContent = '计算失败，请重试或刷新页面。';
        console.error(error);
    }
    function computeAndDisplay() {
        computation.cancel();
        const validMaps = getCurrentValidMaps();
        if (validMaps.length === 0) {
            renderTopCars([], [], new Set());
            loadingOverlay.classList.remove('show');
            currentBestSchemes = [];
            schemeSelect.innerHTML = '';
            const opt = document.createElement('option');
            opt.textContent = '请至少选择一张地图';
            opt.disabled = true;
            schemeSelect.appendChild(opt);
            schemeSelect.disabled = true;
            schemeCountBadge.textContent = '0';
            resultGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#8f9bcb;">请先选择地图</div>`;
            return;
        }


        try {
            // 输入在当前事件中准备完毕，排队任务不读取后来变化的界面状态。
            const candidates = prepareMapCandidates(validMaps, currentZone);
            const ownedInZone = new Set(getCurrentCarList().filter(car => selectedCars.has(car)));
            renderTopCars(validMaps, candidates, ownedInZone);
            computation.run({
                compute: () => {
                    const schemes = allocator.generateParetoSchemes(candidates, ownedInZone, SCHEME_LIMIT, NO_CAR_PRIORITY);
                    return mapSchemesToRows(schemes, validMaps, ROWS);
                },
                publish: updateUIWithSchemes,
                onError: computationError,
                onStart: () => loadingOverlay.classList.add('show'),
                onFinish: () => loadingOverlay.classList.remove('show'),
            });
        } catch (error) {
            loadingOverlay.classList.remove('show');
            computationError(error);
        }
    }

    // 事件绑定
    function bindEvents() {
        bigSelects.forEach(sel => sel.addEventListener('change', () => { refreshBigMaps(); computeAndDisplay(); }));
        smallSelects.forEach(sel => sel.addEventListener('change', computeAndDisplay));
        recommendBtn.addEventListener('click', computeAndDisplay);
        selectAllBtn.addEventListener('click', () => { selectAll(); computeAndDisplay(); });
        clearAllBtn.addEventListener('click', () => { clearAll(); computeAndDisplay(); });

        // 排序按钮循环: 字母顺序 → 分数降序 → 分数升序
        document.getElementById('sortBtn').addEventListener('click', () => {
            const SORT_CYCLE = ['alpha', 'score-desc', 'score-asc'];
            const idx = SORT_CYCLE.indexOf(sortMode);
            sortMode = SORT_CYCLE[(idx + 1) % SORT_CYCLE.length];
            savePreference(APP_CONFIG.storageKeys.sortMode, sortMode);
            renderGarage();
        });

        // 等级筛选按钮
        document.getElementById('classFilter').addEventListener('click', (e) => {
            const btn = e.target.closest('.class-filter-btn');
            if (!btn) return;
            const cls = btn.dataset.class || null;
            filterClass = cls;
            renderGarage();
        });

        // 特殊跑法开关点击 + 下拉选择（绑定到 scPanel）
        document.getElementById('scPanel').addEventListener('click', function(e) {
            var toggle = e.target.closest('.sc-toggle');
            if (!toggle) return;
            var mapKey = toggle.dataset.mapkey;
            var current = specialRouteEnabled[mapKey];
            // 单类型 toggle：off <-> all
            specialRouteEnabled[mapKey] = current === 'off' ? 'all' : 'off';
            computeAndDisplay();
        });
        document.getElementById('scPanel').addEventListener('change', function(e) {
            var sel = e.target.closest('.sc-select');
            if (!sel) return;
            var mapKey = sel.dataset.mapkey;
            specialRouteEnabled[mapKey] = sel.value;
            computeAndDisplay();
        });

        // 统一的车库点击处理：选中车 vs 星级 popover
        carGrid.addEventListener('click', function(e) {
            const ocButton = e.target.closest('.oc-toggle');
            if (ocButton) {
                const car = ocButton.dataset.ocCar;
                if (APP_CONFIG.server === 'global' && selectedCars.has(car) && ocAvailable.has(car)) {
                    ocMap[car] = !ocMap[car]; stageGuestGarage(); renderCarTags(); computeAndDisplay();
                }
                return;
            }
            // 星级 popover 按钮点击
            const optBtn = e.target.closest('.star-opt');
            if (optBtn) {
                const car = optBtn.dataset.car;
                const stars = parseInt(optBtn.dataset.stars, 10);
                if (APP_CONFIG.server !== 'global' && car && stars >= 1 && stars <= 6) {
                    setCarStars(car, stars);
                    buildMapIndex();
                    renderCarTags();
                    computeAndDisplay();
                }
                return;
            }
            // 星级显示按钮点击 → 切换 popover 显隐
            const display = e.target.closest('.star-display');
            if (display) {
                const popover = display.querySelector('.star-popover');
                if (popover) {
                    const isOpen = popover.classList.contains('show');
                    // 关闭其他所有 popover
                    document.querySelectorAll('.star-popover.show').forEach(function(p) { p.classList.remove('show'); });
                    if (!isOpen) {
                        popover.classList.add('show');
                    }
                }
                return;
            }
            // 普通标签点击 → 切换选中
            const tag = e.target.closest('.car-tag');
            if (tag && tag.dataset.carNick) {
                onCarTagClick(e);
            }
        });

        // 点击页面其他地方关闭所有 popover
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.star-display') && !e.target.closest('.star-popover')) {
                document.querySelectorAll('.star-popover.show').forEach(function(p) { p.classList.remove('show'); });
            }
        });

        // 方案下拉切换恢复计算结果（已有，保留）

        const searchInput = document.getElementById('garageSearch');
        searchInput.addEventListener('input', () => {
            searchQuery = searchInput.value.trim();
            renderGarage();
        });
        schemeSelect.addEventListener('change', (e) => {
            const idx = parseInt(e.target.value, 10);
            if (!isNaN(idx) && idx >= 0 && idx < currentBestSchemes.length) {
                renderResultGrid(currentBestSchemes[idx]);
            }
        });
    }

    // 档位切换
    function initTierToggle() {
        if (APP_CONFIG.server === 'global') { currentTier = '理论'; document.getElementById('tierToggle').hidden = true; return; }
        const labels = document.querySelectorAll('#tierToggle label');
        labels.forEach(label => {
            label.addEventListener('click', () => {
                const tier = label.dataset.tier;
                if (tier === currentTier) return;
                currentTier = tier;
                // 更新样式
                labels.forEach(l => {
                    l.className = l.dataset.tier === currentTier ? 'active' : 'inactive';
                });
                // 重构建地图索引（档位数据不同）
                buildMapIndex();
                refreshBigMaps();
                // 如果理论档，更新小标题提示
                updateSubtitle();
                computeAndDisplay();
            });
        });
        // 初始样式
        labels.forEach(l => {
            l.className = l.dataset.tier === currentTier ? 'active' : 'inactive';
        });
    }

    function updateSubtitle() {
        if (APP_CONFIG.server === 'global') { const sub = document.querySelector('.sub'); if (sub) sub.textContent = '国际服 · 五区满星理论参考 · 含特殊跑法'; return; }
        const tierInfo = RACE_DATA?.tier_info?.[currentTier];
        const sub = document.querySelector('.sub');
        if (sub && tierInfo) {
            let desc = tierInfo.desc;
            // 理论档在四区模式下显示不同描述
            if (currentTier === '理论' && currentZone === 'zone4') {
                desc = '顶级特改理论成绩，默认最优解，含特殊跑法';
            }
            sub.textContent = desc;
        }
    }

    // 四区/五区切换
    /** 更新四区提示的显隐 */
    function updateZoneHint() {
        var hint = document.getElementById('zoneHint');
        if (hint) hint.classList.toggle('show', currentZone === 'zone4');
    }

    function initZoneToggle() {
        if (APP_CONFIG.server === 'global') { currentZone = 'zone5'; document.getElementById('zoneToggle').hidden = true; return; }
        const labels = document.querySelectorAll('#zoneToggle label');
        labels.forEach(label => {
            label.addEventListener('click', () => {
                const zone = label.dataset.zone;
                if (zone === currentZone) return;
                currentZone = zone;
                saveZoneMode();
                // 更新toggle样式
                labels.forEach(l => {
                    l.className = l.dataset.zone === currentZone ? 'active' : 'inactive';
                });
                // 四区提示显示切换
                var hint = document.getElementById('zoneHint');
                if (hint) hint.classList.toggle('show', currentZone === 'zone4');
                // 重渲染
                buildMapIndex();
                updateSubtitle();
                renderGarage();
                computeAndDisplay();
            });
        });
        // 设置初始样式
        labels.forEach(l => {
            l.className = l.dataset.zone === currentZone ? 'active' : 'inactive';
        });
    }

    /**
     * 应用入口。初始化顺序：
     *   data.json 加载 → cars.json 加载（必需）→ 车库/分区/星级恢复
     *   → 地图索引构建 → UI 渲染 → 事件绑定 → 首次计算
     */
    function prepareServerNavigation(event, link, server) {
        if (event.defaultPrevented || event.button > 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        if (server === APP_CONFIG.server && !APP_CONFIG.serverError) { event.preventDefault(); return; }
        const account = APP_CONFIG.server !== 'global' && globalThis.accountUI?.active();
        if (!account && guestDirty) {
            try {
                const draft = JSON.stringify({base:guestBase, profile:profileNow()});
                sessionStorage.setItem(guestDraftKey, draft);
                if (sessionStorage.getItem(guestDraftKey) !== draft) throw Error('草稿缓存未完成');
            } catch (error) {
                event.preventDefault();
                globalThis.RACEPICK_SERVER_NAVIGATION = null;
                storageResult(APP_CONFIG.storageKeys.garage, '临时车库草稿无法缓存，暂不能切换服务器；请先保存或恢复车库');
                return;
            }
        }
        // Only the explicit server links may skip the usual leave-page prompt.
        // Account drafts are independently checked by auth.js beforeunload.
        globalThis.RACEPICK_SERVER_NAVIGATION = {kind:'server-switch', target:link.href, guestDraftPreserved:!account};
    }
    function initServerControls() {
        for (const server of ['cn', 'global']) {
            const link = document.getElementById(server === 'cn' ? 'serverCnLink' : 'serverGlobalLink');
            const url = new URL(globalThis.location?.href || 'http://localhost/');
            if (server === 'global') url.searchParams.set('server', 'global'); else url.searchParams.delete('server');
            url.hash = ''; link.href = url.href;
            link.className = 'toggle-choice ' + (server === APP_CONFIG.server ? 'active' : 'inactive');
            link.addEventListener('click', event => prepareServerNavigation(event, link, server));
            if (server === APP_CONFIG.server) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
        }
        document.getElementById('classFilterR').hidden = APP_CONFIG.server === 'global';
        if (APP_CONFIG.server === 'global') {
            document.title = '国际服 · 擂台选车助手';
            const note = document.getElementById('serverNote'); note.hidden = false;
            note.textContent = '国际服车库保存于本机。仅五区满星理论；开启OC后仅使用已收录的OC成绩。富士山两图暂缺成绩。';
            document.getElementById('tierToggle').hidden = true;
            document.getElementById('zoneToggle').hidden = true;
        }
    }
    async function initApp() {
        try {
            initServerControls();
            // 通过 api 层加载数据
            if (typeof api === 'undefined') throw Error('页面脚本未完整加载，请稍后刷新重试');
            RACE_DATA = await api.getRaceData();

            // 加载车辆度量数据 —— cars.json 同时承载车池（zones）与星级规则（star_rule），
            // 因此现在是必需依赖：加载失败不再降级，直接报错。
            const carData = await api.getCars();
            carStats = {};
            nickToName = {};
            for (const c of carData.cars) {
                carStats[c.title] = c;
            }
            Object.assign(nickToName, carData._nickname_map);
            // 车辆条目自带 nickname 也并入（防止 _nickname_map 漏项导致排序/搜索失效, 如 biome）
            for (const c of carData.cars) {
                if (c.nickname && !nickToName[c.nickname]) nickToName[c.nickname] = c.title;
            }
            ocAvailable = new Set((RACE_DATA.tracks || []).flatMap(track => (track['五区']?.['理论'] || []).filter(entry => entry.cars?.[0]?.oc === true).map(entry => entry.cars[0].name)));
            buildCarRules();            // 由 zones / star_rule 派生车池与星级规则

            if (APP_CONFIG.server !== 'global' && globalThis.accountUI) await accountUI.init({
                known: new Set([...zone5Cars, ...zone4Cars]),
                read: profileNow,
                apply: profile => {
                    selectedCars = appState.garage(profile.cars, new Set([...zone5Cars, ...zone4Cars]));
                    starsMap = profile.stars;
                    buildMapIndex(); renderGarage(); computeAndDisplay();
                }
            });
            await loadGarage();        // 加载车库（现在 zone5Cars/zone4Cars 已就绪）
            loadStarsMap();             // 加载星级
            loadOcMap();
            restoreGuestDraft();
            buildMapIndex();            // 用恢复后的分区和星级构建优先级
            // 恢复排序模式
            const savedSort = api.loadPref(APP_CONFIG.storageKeys.sortMode);
            if (['alpha', 'score-desc', 'score-asc'].includes(savedSort)) sortMode = savedSort;
            renderMapRows();
            renderGarage();
            refreshBigMaps();
            bindEvents();
            initTierToggle();
            initZoneToggle();
            updateZoneHint();
            updateSubtitle();
            document.getElementById('garageSaveBtn').onclick=commitGarage;
            document.getElementById('garageRestoreBtn').onclick=restoreGarage;
            globalThis.addEventListener?.('garage-save-state',updateGarageSaveStatus);
            globalThis.addEventListener?.('beforeunload',e=>{if(guestDirty&&!(globalThis.RACEPICK_SERVER !== 'global' && globalThis.accountUI?.active())&&!globalThis.RACEPICK_SERVER_NAVIGATION?.guestDraftPreserved){e.preventDefault();e.returnValue='';}});
            updateGarageSaveStatus();computeAndDisplay();
            globalThis.dispatchEvent?.(new Event('racepick-ready'));
        } catch (err) {
            const hint = globalThis.location?.protocol === 'file:' ? '请通过 HTTP 服务打开页面' : '请稍后重试；若持续失败，请反馈当前服别和错误信息';
            mapRowsContainer.innerHTML = `<div class="loading" style="color:#f99;padding:30px;">❌ 加载失败: ${err.message}<br>${hint}</div>`;
            console.error(err);
        }
    }

    initApp();
})();
</script>
</body>
