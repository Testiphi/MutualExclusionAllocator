<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩填写</title>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        body { background: #0d1117; margin: 0; min-height: 100vh; padding: 12px; color: #e6edf3; }
        .card { max-width: 720px; margin: 0 auto; background: #161b22; border: 1px solid #21262d; border-radius: 14px; padding: 16px; }
        h1 { font-size: 1.25rem; margin: 0 0 12px; font-weight: 600; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
        .tg { display: inline-flex; background: #21262d; border-radius: 8px; overflow: hidden; }
        .tg button { background: transparent; border: none; color: #8b949e; padding: 6px 14px; font-size: .85rem; cursor: pointer; }
        .tg button.on { background: #1f6feb; color: #fff; }
        .stat { font-size: .82rem; color: #8b949e; margin-left: auto; }
        .btn { background: #238636; color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: .85rem; cursor: pointer; }
        .btn.ghost { background: transparent; border: 1px solid #30363d; color: #8b949e; }
        .mapname { font-size: .8rem; color: #58a6ff; margin: 10px 2px 4px; font-weight: 600; }
        .trk { background: #0d1117; border: 1px solid #21262d; border-radius: 10px; margin-bottom: 6px; overflow: hidden; }
        .trk-hd { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; }
        .trk-hd .name { font-size: .95rem; font-weight: 500; }
        .trk-hd .arrow { margin-left: auto; color: #8b949e; }
        .trk-body { display: none; border-top: 1px solid #21262d; }
        .trk.open .trk-body { display: block; }
        .row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid #161b22; }
        .row:last-child { border-bottom: none; }
        .row .car { width: 96px; flex-shrink: 0; font-size: .9rem; }
        .row .car small { color: #8b949e; font-size: .72rem; }
        .row .val { flex: 1; color: #8b949e; font-size: .85rem; text-align: right; }
        .row .val.has { color: #e6edf3; }
        .row input { width: 90px; background: #21262d; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px; padding: 5px 8px; font-size: .9rem; text-align: right; }
        .row input.dirty { border-color: #d29922; background: rgba(210,153,34,.12); }
        .empty { color: #8b949e; text-align: center; padding: 30px; font-size: .85rem; }
        #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #238636; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: .85rem; display: none; }
        .loading { color: #8b949e; text-align: center; padding: 40px; }
    </style>
</head>
<body>
<div class="card">
    <h1>🏁 成绩填写</h1>
    <div class="toolbar">
        <div class="tg" id="zoneTg">
            <button data-z="五区" class="on">五区</button><button data-z="四区">四区</button>
        </div>
        <div class="tg" id="tierTg">
            <button data-t="理论" class="on">理论</button><button data-t="高手">高手</button>
        </div>
        <span class="stat" id="stat"></span>
    </div>
    <div style="margin-bottom:10px; display:flex; gap:8px;">
        <button class="btn" id="exportBtn">📤 导出建议</button>
        <button class="btn ghost" id="clearBtn">清空</button>
    </div>
    <div id="mapList"><div class="loading">…</div></div>
</div>
<div id="toast"></div>
<script>
(() => {
    const LS_KEY = 'fillDraft_' + location.pathname;
    let DATA = null;
    let CLASSES = null;
    let zone = '五区', tier = '理论';
    let dirty = {};
    let openSet = new Set();
    const REC_SHORT = 24, REC_LONG = 45;

    const $ = s => document.querySelector(s);
    const starsKey = s => s == null ? '' : '★' + s;
    const cellKey = (z, t, track, car, stars) => z + '|' + t + '|' + track + '|' + car + '|' + stars;

    function toast(msg) {
        const el = $('#toast'); el.textContent = msg; el.style.display = 'block';
        clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 1600);
    }
    function save() { api.savePref(LS_KEY, { dirty, v: 1 }); }

    async function init() {
        try {
            DATA = await api.getRaceData();
            try {
                const r = await fetch('car_classes.json');
                if (r.ok) CLASSES = (await r.json()).cars;
            } catch (e) { /* 无画像数据时页面为空 */ }
            const saved = api.loadPref(LS_KEY, null);
            if (saved && saved.dirty) dirty = saved.dirty;
            bindToggles();
            render();
        } catch (e) {
            $('#mapList').innerHTML = `<div class="empty">加载失败: ${e.message}</div>`;
        }
    }

    function bindToggles() {
        document.querySelectorAll('#zoneTg button').forEach(b => b.onclick = () => {
            zone = b.dataset.z;
            document.querySelectorAll('#zoneTg button').forEach(x => x.classList.toggle('on', x === b));
            render();
        });
        document.querySelectorAll('#tierTg button').forEach(b => b.onclick = () => {
            tier = b.dataset.t;
            document.querySelectorAll('#tierTg button').forEach(x => x.classList.toggle('on', x === b));
            render();
        });
        $('#exportBtn').onclick = exportJson;
        $('#clearBtn').onclick = () => { dirty = {}; openSet.clear(); save(); render(); toast('已清空'); };
    }

    // ===== 地图主导维度（规则与回测原型一致: 每图每区, 维度≥2辆有成绩, 平均差距最小者为图型）=====
    const R_MAIN = { '玻璃': '超高速', '陀飞轮': '超高速', '杰皇': '超高速', 'f5r': '超高速', '300+': '超高速', '银电': '超高速', '小蜥蜴': '三维车' };
    const DIMS = ['三维车', '高速加速', '高速', '超高速'];

    function dimOf(car) {
        const info = CLASSES && CLASSES[car];
        if (!info) return null;
        if (car === 'r兔' || car === '恶魔' || car === '大超') return null;
        return R_MAIN[car] || info['类'];
    }

    function zonePool(z) {
        // 该区出现过条目的车集合（R级五区专属车在四区自动排除）
        const pool = new Set();
        for (const t of DATA.tracks) {
            for (const tier2 of ['理论', '高手', '普通', '自动']) {
                for (const e of t[z]?.[tier2] || []) {
                    for (const c of e.cars) pool.add(c['name']);
                }
            }
        }
        return pool;
    }

    function zoneBest(z, tk) {
        let best = Infinity;
        for (const t of DATA.tracks) {
            if (t['小地图'] !== tk) continue;
            for (const tier2 of ['理论', '高手']) {
                for (const e of t[z]?.[tier2] || []) {
                    if (!e.sc && e.time != null && e.time < best) best = e.time;
                }
            }
        }
        return best;
    }

    function mapTypeOf(z, tk) {
        const best = zoneBest(z, tk);
        if (!isFinite(best)) return null;
        // 每车每区取最快成绩, 按维度聚合
        const carBest = {};
        for (const t of DATA.tracks) {
            if (t['小地图'] !== tk) continue;
            for (const tier2 of ['理论', '高手']) {
                for (const e of t[z]?.[tier2] || []) {
                    if (e.sc || e.time == null) continue;
                    for (const c of e.cars) {
                        if (e.time < (carBest[c.name] ?? Infinity)) carBest[c.name] = e.time;
                    }
                }
            }
        }
        const dimTimes = {};
        for (const car in carBest) {
            const dm = dimOf(car);
            if (dm) (dimTimes[dm] = dimTimes[dm] || []).push(carBest[car]);
        }
        let type = null, bestGap = Infinity;
        for (const dm of DIMS) {
            const ts = dimTimes[dm];
            if (!ts || ts.length < 2) continue;
            const gap = ts.reduce((a, b) => a + (b / best - 1), 0) / ts.length;
            if (gap < bestGap) { bestGap = gap; type = dm; }
        }
        return type;
    }

    // ===== 列表 =====
    let CLASS_DIM = null;
    function classDimMembers() {
        if (!CLASS_DIM && CLASSES) {
            CLASS_DIM = {};
            for (const car in CLASSES) {
                const dm = dimOf(car);
                if (dm) (CLASS_DIM[dm] = CLASS_DIM[dm] || []).push(car);
            }
        }
        return CLASS_DIM || {};
    }

    function shownEntries(track) {
        const tk = track['小地图'];
        const type = mapTypeOf(zone, tk);
        const tierEntries = track[zone]?.[tier] || [];
        const out = [];
        const keyed = new Set();
        // 1) 本档已有成绩的全部条目（任意维度）— 参考数据, 可改
        for (const e of tierEntries) {
            if (e.sc) continue;
            for (const c of e.cars) {
                if (e.time == null) continue;
                const stars = c.stars ?? null;
                const k = cellKey(zone, tier, tk, c.name, stars);
                if (keyed.has(k)) continue;
                keyed.add(k);
                out.push({ car: c.name, stars, old: e.time, key: k, kind: 'data' });
            }
        }
        if (!type) return out;
        // 2) 图型维度缺成绩 → 空行（推荐填）
        const withTimeCar = new Set(out.map(x => x.car));
        const pushTarget = (car, stars, existing) => {
            const k = cellKey(zone, tier, tk, car, stars);
            if (keyed.has(k)) return;
            keyed.add(k);
            out.push({ car, stars, old: null, key: k, kind: 'target', existing });
        };
        for (const e of tierEntries) {
            if (e.sc) continue;
            for (const c of e.cars) {
                if (e.time != null) continue;
                if (dimOf(c.name) !== type) continue;   // 非图型维度占位不推荐
                pushTarget(c.name, c.stars ?? null, true);
            }
        }
        // 理论档: 图型维度车在本档完全无条目 → 一并列出（提交时新建条目）
        if (tier === '理论') {
            const pool = zonePool(zone);
            const present = new Set();
            for (const e of tierEntries) if (!e.sc) for (const c of e.cars) present.add(c.name);
            for (const car of classDimMembers()[type] || []) {
                // 该区车池外的不列（如 四区 不含 小蜥蜴/陀飞轮/300+/f5r 等五区专属R级）
                if (!pool.has(car)) continue;
                if (!withTimeCar.has(car) && !present.has(car)) pushTarget(car, null, false);
            }
        }
        // 空行(推荐填)在前, 已有数据在后
        return out.sort((a, b) => (a.kind === 'target' ? 0 : 1) - (b.kind === 'target' ? 0 : 1));
    }

    function statLine() {
        const n = Object.keys(dirty).length;
        return n ? `${n} 条建议` : '';
    }

    function render() {
        $('#stat').textContent = statLine();
        const box = $('#mapList');
        box.innerHTML = '';
        let curMap = null, groupEl = null, any = false;
        for (const t of DATA.tracks) {
            const entries = shownEntries(t);
            if (!entries.length) continue;
            any = true;
            if (t['大地图'] !== curMap) {
                curMap = t['大地图'];
                groupEl = document.createElement('div');
                groupEl.className = 'mapgroup';
                const mn = document.createElement('div');
                mn.className = 'mapname'; mn.textContent = curMap;
                groupEl.appendChild(mn);
                box.appendChild(groupEl);
            }
            const tk = t['小地图'];
            const trk = document.createElement('div');
            trk.className = 'trk' + (openSet.has(tk) ? ' open' : '');
            const hd = document.createElement('div');
            hd.className = 'trk-hd';
            hd.innerHTML = `<span class="name">${tk}</span><span class="arrow">▾</span>`;
            hd.onclick = () => { openSet.has(tk) ? openSet.delete(tk) : openSet.add(tk); render(); };
            trk.appendChild(hd);
            const body = document.createElement('div');
            body.className = 'trk-body';
            for (const x of entries) {
                const row = document.createElement('div');
                row.className = 'row';
                const dirtyVal = dirty[x.key];
                const input = document.createElement('input');
                input.type = 'number'; input.min = '0'; input.step = '0.01';
                if (dirtyVal !== undefined) { input.value = dirtyVal; input.classList.add('dirty'); }
                input.oninput = () => {
                    const v = input.value.trim();
                    if (v === '') { delete dirty[x.key]; input.classList.remove('dirty'); }
                    else if (!isNaN(+v) && +v > 0) { dirty[x.key] = String(+v); input.classList.add('dirty'); }
                    save(); $('#stat').textContent = statLine();
                };
                const carSpan = document.createElement('span');
                carSpan.className = 'car';
                carSpan.innerHTML = x.car + (starsKey(x.stars) ? `<small>${starsKey(x.stars)}</small>` : '');
                const valSpan = document.createElement('span');
                valSpan.className = 'val' + (x.old != null ? ' has' : '');
                valSpan.textContent = x.old != null ? x.old : '';
                row.appendChild(carSpan);
                row.appendChild(valSpan);
                row.appendChild(input);
                body.appendChild(row);
            }
            trk.appendChild(body);
            groupEl.appendChild(trk);
        }
        if (!any) box.innerHTML = '<div class="empty">—</div>';
    }

    function exportJson() {
        const keys = Object.keys(dirty);
        if (!keys.length) { toast('还没有改动'); return; }
        const proposals = [];
        for (const k of keys) {
            const p = k.split('|');
            const z = p[0], t = p[1], trackName = p[2], car = p[3];
            const stars = p[4] === '' ? null : p[4];
            const track = DATA.tracks.find(x => x['小地图'] === trackName);
            let e = null;
            if (track) {
                for (const en of track[z]?.[t] || []) {
                    if (en.sc) continue;
                    for (const c of en.cars) {
                        if (c.name === car && (c.stars ?? null) === stars) e = en;
                    }
                }
            }
            proposals.push({
                zone: z, tier: t, track: trackName, car, stars,
                old: e && e.time != null ? e.time : null,
                new: +dirty[k]
            });
        }
        const out = { version: 1, generatedBy: 'fill.html', count: proposals.length, proposals };
        const text = JSON.stringify(out, null, 2);
        const blob = new Blob([text], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'my_suggestions.json';
        a.click();
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('已导出')).catch(() => toast('已导出文件'));
        else toast('已导出文件');
    }

    init();
})();
</script>
</body>
</html>
