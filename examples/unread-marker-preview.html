<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未读标记预览 · RacePick</title><link rel="stylesheet" href="../ui.css"><style>body{background:#0d1117;color:#e6edf3;font:15px system-ui;margin:0;padding:28px;max-width:850px}h1{font-size:23px}p{color:#a7b4c5;line-height:1.8}.row{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.panel{border:1px solid #303d50;border-radius:12px;padding:20px;margin:18px 0;background:#141c28}.link{display:flex;justify-content:space-between;align-items:center;border:1px solid #46576c;border-radius:8px;padding:14px;margin:10px 0;gap:16px}.muted{color:#a7b4c5}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff6b72;margin-left:8px;flex:none;vertical-align:middle}.dot[hidden]{display:none}button,.link,.title{position:relative}body[data-position="top-right"] .dot{position:absolute;right:5px;top:5px;margin:0}body[data-position="top-left"] .dot{position:absolute;left:5px;top:5px;margin:0}.title{display:inline-block;padding:6px}.positions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button{cursor:pointer}.title{font-weight:600}.hint{font-size:13px}.list{line-height:2}.action{color:#91caff}</style><h1>未读标记预览</h1><p>小圆点放在文字右侧，不闪烁、不显示数字。外层菜单、内部入口和具体条目逐级提示。下面使用虚构内容，可点击“模拟已读”切换效果。</p><div class="positions"><label>小圆点位置：<select onchange="document.body.dataset.position=this.value"><option value="inline">文字右侧</option><option value="top-right">右上角</option><option value="top-left">左上角</option></select></label></div><div class="row"><button>数据贡献<span class="dot" data-group="mine" role="img" aria-label="有未读内容"></span></button><button>管理工作台<span class="dot" data-group="review feedback" role="img" aria-label="有未读内容"></span></button><button>个人中心<span class="dot" data-group="reply" role="img" aria-label="有未读内容"></span></button></div><div class="panel"><h2>管理工作台</h2><div class="link"><span class="title">投稿审核<span class="dot" data-group="review" role="img" aria-label="有未读内容"></span><br><small class="muted">审核玩家投稿，填写反馈与质量评分</small></span><button onclick="read('review')">模拟已读</button></div><div class="link"><span class="title">用户反馈（待处理 2）<span class="dot" data-group="feedback" role="img" aria-label="有未读内容"></span><br><small class="muted">查看问题反馈并回复用户</small></span><button onclick="read('feedback')">模拟已读</button></div><p class="hint">点“模拟已读”后，待处理 2 保留。另一位管理员的已读状态不受影响。</p></div><div class="panel"><h2>数据贡献 / 个人中心</h2><div class="link"><span>我的投稿<span class="dot" data-group="mine" role="img" aria-label="有未读内容"></span><br><small class="muted">收到审核结果、补充要求或评语更新</small></span><button onclick="read('mine')">模拟已读</button></div><div class="link"><span>问题反馈<span class="dot" data-group="reply" role="img" aria-label="有未读内容"></span><br><small class="muted">收到站长回复或处理结果</small></span><button onclick="read('reply')">模拟已读</button></div></div><div class="panel"><h2>列表条目示例</h2><div class="list">示例投稿 · 新增来源说明<span class="dot" data-group="review" role="img" aria-label="有未读内容"></span><br><span class="muted">状态：待审核</span></div><p class="hint">进入列表不会全部清除。打开具体详情并成功显示，才标记该条已读。</p></div><button onclick="location.reload()">恢复预览</button><script>const seen=new Set();function read(k){seen.add(k);for(const n of document.querySelectorAll('[data-group]'))n.hidden=n.dataset.group.split(' ').every(x=>seen.has(x));}</script></html>
