<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>擂台成绩表</title><link rel="stylesheet" href="/ui.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/coverage.css"><script defer src="/coverage.js"></script></head>
<body class="rp-page"><header><a class="ui-button" href="/">← 返回选车助手</a><h1>擂台成绩表</h1><p class="muted">每图一条公开参考，点击空白格补成绩。</p></header><main>
<form id="filters" class="toolbar"><label>服别<select id="server"><option value="cn">国服</option><option value="global">国际服</option></select></label><label>大地图<select id="map"><option value="all">全部地图</option></select></label><label>跑法<select id="route"><option value="normal">普通跑法</option><option value="special">特殊跑法</option></select></label><label id="star-label" hidden>高手星级<select id="star"><option value="all">全部星级</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label>车辆列搜索<input id="search" type="search" maxlength="80" autocomplete="off"></label><label class="check"><input id="gaps" type="checkbox">只看当前列缺口</label><button type="submit">查询 / 刷新</button></form>
<div class="rights"><p id="rights"></p><div class="actions"><button id="choose-map" hidden>选择解锁地图</button><button id="progress">解锁进度</button></div></div>
<div class="legend"><span><b>***</b> 未解锁</span><span class="public-ref">参考</span><span><i class="empty-sample"></i> 可投稿</span><span><i class="pending-sample"></i> 待审核</span><span>非OC</span></div>
<p id="message" role="status" class="warning"></p><p id="summary" class="muted"></p>
<div id="sheet-wrap" class="sheet-wrap" tabindex="0" role="region" aria-label="成绩覆盖表，可横向与纵向滚动"><table id="sheet"><thead id="head"></thead><tbody id="body"></tbody></table></div><p id="empty-result" class="muted" hidden>当前列或地图没有结果，请调整筛选。</p>
<div class="paging"><button id="previous-columns">上一组车辆</button><span id="column-page"></span><button id="next-columns">下一组车辆</button></div><nav id="sheets" class="sheets" aria-label="工作表"></nav>
</main>
<dialog id="submit-dialog" aria-labelledby="submit-title"><h2 id="submit-title">补充成绩</h2><dl id="target" class="target"></dl><form id="submission-form"><label>成绩<input id="time" required maxlength="24" placeholder="秒或分:秒，最多3位小数" inputmode="decimal"></label><label>来源 / 证据说明<textarea id="evidence" maxlength="2000"></textarea></label><label>视频链接（可选）<input id="video" type="url" maxlength="1000" placeholder="https://"></label><p class="muted">需补图片时，可先保存草稿。</p><p id="form-error" role="alert" class="warning"></p><a id="saved-draft" hidden>打开已保存草稿</a><div class="actions"><button type="button" data-close="submit-dialog">取消</button><button type="button" id="save-draft">保存草稿，补图片</button><button type="submit" id="send" class="primary">提交审核</button></div></form></dialog>
<dialog id="choice-dialog" aria-labelledby="choice-title"><h2 id="choice-title">选择一级解锁地图</h2><p>不扣积分，确认后不能自行更换。</p><label>大地图<select id="choice"></select></label><p id="choice-error" role="alert" class="warning"></p><div class="actions"><button data-close="choice-dialog">取消</button><button id="confirm-choice" class="primary">确认选择</button></div></dialog>
<dialog id="progress-dialog" aria-labelledby="progress-title"><h2 id="progress-title">解锁进度</h2><p id="progress-summary"></p><table class="progress-table"><thead><tr><th>权益</th><th>条件</th><th>状态</th></tr></thead><tbody><tr><td>自选1张国服大地图</td><td>积分≥50，有效贡献≥5</td><td id="one-status"></td></tr><tr><td>全部国服地图</td><td>积分≥150，有效贡献≥15，高质量≥5</td><td id="two-status"></td></tr></tbody></table><p class="muted">有效贡献：质量≥6分；高质量：≥8分。待审不计分。评分或采用奖励调整后按最新账本计算。</p><div class="actions"><button data-close="progress-dialog">返回表格</button></div></dialog>
</body></html>
