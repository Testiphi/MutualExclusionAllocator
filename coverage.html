<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>擂台成绩表</title><link rel="stylesheet" href="/ui.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/coverage.css"><script defer src="/coverage.js"></script></head>
<body class="rp-page"><header><a id="home-link" class="ui-button" href="/">← 返回选车助手</a><a id="submit-link" class="ui-button" href="/submissions">投稿 / 我的记录</a><h1>擂台成绩表</h1><p class="muted">点击空白格补成绩。</p></header><main>
<form id="filters" class="toolbar"><label>服别<select id="server"><option value="cn">国服</option><option value="global">国际服</option></select></label><label>大地图<select id="map"><option value="all">全部地图</option></select></label><label>跑法<select id="route"><option value="normal">普通跑法</option><option value="special">特殊跑法</option></select></label><label>车辆列搜索<input id="search" type="search" maxlength="80" autocomplete="off"></label><label class="check" id="oc-filter" hidden><input id="oc" type="checkbox">OC超频</label><button type="submit">查询 / 刷新</button></form>
<div class="legend"><span><i class="empty-sample"></i> 可投稿</span><span><i class="pending-sample"></i> 待审核</span><span id="oc-legend">非OC</span></div>
<p id="message" role="status" class="warning"></p><p id="summary" class="muted"></p>
<div id="sheet-wrap" class="sheet-wrap" tabindex="0" role="region" aria-label="成绩覆盖表，可横向与纵向滚动"><table id="sheet"><thead id="head"></thead><tbody id="body"></tbody></table></div><p id="empty-result" class="muted" hidden>当前列或地图没有结果，请调整筛选。</p>
<div class="paging"><button id="previous-columns">上一组车辆</button><span id="column-page"></span><button id="next-columns">下一组车辆</button></div><nav id="sheets" class="sheets" aria-label="工作表"></nav>
</main>
<div id="cell-tap-hint" class="cell-tap-hint" role="status" hidden>再点一次填写</div>
</body></html>
