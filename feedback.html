<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问题反馈 · RacePick</title><link rel="stylesheet" href="/submissions.css"><link rel="stylesheet" href="/ui.css"><script defer src="/notifications.js"></script><script defer src="/feedback.js"></script><link rel="stylesheet" href="/theme.css"></head><body class="rp-page">
<header><a class="ui-button ui-secondary" href="/">← 返回选车助手</a><h1 id="heading">问题反馈</h1><p id="identity">正在检查登录状态…</p><nav id="navigation" hidden><button id="newTicket" type="button">新建反馈</button><button id="myTickets" type="button">我的反馈</button><a id="adminLink" class="ui-button ui-secondary" href="/admin-feedback" hidden>管理用户反馈</a></nav></header>
<main id="main" hidden><p id="message" role="status" aria-live="polite"></p>
<section id="compose" class="feedback-card" hidden><h2>告诉我们遇到了什么问题</h2><p class="muted">仅你和站长可查看。成绩补充请使用<a href="/submissions#new">成绩投稿</a>；问题反馈不直接修改成绩，也不计贡献分。请勿填写密码或验证链接。</p>
<form id="createForm"><div class="fields"><label>问题类型<select id="category"><option value="bug">功能异常</option><option value="data">数据问题</option><option value="suggestion">使用建议</option><option value="other">其他</option></select></label><label class="wide">标题<input id="title" maxlength="100" required placeholder="简要描述问题"></label><label class="wide">问题描述<textarea id="description" maxlength="6000" required placeholder="发生了什么问题？"></textarea></label><label class="wide">复现步骤（可选）<textarea id="steps" maxlength="3000" placeholder="依次做了哪些操作？"></textarea></label><label>预期结果（可选）<textarea id="expected" maxlength="2000"></textarea></label><label>实际结果（可选）<textarea id="actual" maxlength="2000"></textarea></label></div>
<p id="context" class="feedback-meta"></p><p class="muted">只附带当前账号、提交时间、上方页面路径及应用版本；不采集日志、车库或浏览器信息。本版仅支持文字，不上传附件、不发送通知邮件。</p><button id="sendFeedback" type="submit">提交反馈</button></form></section>
<section id="workspace"><div class="filters"><label>状态<select id="status"><option value="all">全部</option><option value="pending">待处理</option><option value="processing">处理中</option><option value="needs_info">待补充</option><option value="resolved">已解决</option><option value="closed">已关闭</option></select></label><label>标题搜索<input id="search" type="search" maxlength="100"></label><button id="query" type="button">查询</button><button id="refresh" type="button">刷新</button></div>
<p id="count" class="muted"></p><div class="feedback-layout"><aside><div id="list" class="feedback-list"></div><div class="actions"><button id="previous" type="button">上一页</button><button id="next" type="button">下一页</button></div></aside><section id="detail" class="feedback-card"><p>选择一条反馈查看详情。</p></section></div></section>
</main><footer>反馈中的原始描述和往来记录会保留，方便跟进处理。</footer></body></html>
