<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号与公告管理</title><link rel="stylesheet" href="/submissions.css"><script defer src="/admin_accounts.js"></script><style>.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #30363d}td button{margin:3px}textarea{width:100%;min-height:130px}#announcementPreview{white-space:pre-wrap}.filters{flex-wrap:wrap}</style><link rel="stylesheet" href="/ui.css"></head><body>
<header><a class="ui-button ui-secondary" href="/">← 返回选车助手</a><h1>账号与公告管理</h1><p id="identity"></p><nav><button id="usersTab">全部账号</button><button id="newsTab">更新公告</button><a class="ui-button ui-secondary" href="/admin-access">管理员与邀请码</a></nav></header>
<main id="main" hidden><section id="users"><div class="filters"><label>邮箱或昵称搜索<input id="search" type="search" maxlength="254"></label><label>角色<select id="role"><option value="all">全部</option><option value="player">玩家</option><option value="admin">管理员</option><option value="superadmin">超级管理员</option></select></label><label>验证<select id="verified"><option value="all">全部</option><option value="yes">已验证</option><option value="no">待验证</option></select></label><label>状态<select id="status"><option value="all">全部</option><option value="active">正常</option><option value="disabled">停用</option></select></label><button id="query">查询</button></div><p id="count"></p><div class="table-wrap"><table><thead><tr><th>邮箱</th><th>自定义昵称</th><th>榜单展示</th><th>角色/状态</th><th>注册/最近登录</th><th>投稿</th><th>操作</th></tr></thead><tbody id="accounts"></tbody></table></div><button id="previous">上一页</button><button id="next">下一页</button><div id="events"></div></section>
<section id="news" hidden><h2>公告管理</h2><p>为一次功能更新发布一条公告。编辑原公告不会重置用户的“不再提醒”；重大新内容请新建公告。</p><select id="announcements" aria-label="选择公告"></select><button id="load">载入</button><button id="new">新建公告</button><label>标题<input id="title" maxlength="120"></label><label>功能版本标签<input id="release" maxlength="80" placeholder="例如：车库手动保存"></label><label>正文（纯文本）<textarea id="body" maxlength="6000"></textarea></label><div class="actions"><button id="preview">预览</button><button id="save">保存</button><button id="publish">发布公告</button><button id="withdraw">撤下公告</button></div><p id="newsState"></p><div id="announcementPreview"></div></section></main>
<dialog id="notice"><h2>操作提示</h2><p id="message"></p><button id="close">知道了</button></dialog><dialog id="confirm"><h2 id="question"></h2><label id="reasonLabel">操作原因<textarea id="reason" maxlength="200"></textarea></label><button id="cancel">取消</button><button id="yes">确认继续</button></dialog></body></html>
