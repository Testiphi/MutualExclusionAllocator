<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号与公告管理</title><link rel="stylesheet" href="/submissions.css"><script defer src="/admin_accounts.js"></script><style>.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #30363d}td button{margin:3px}textarea{width:100%;min-height:130px}#announcementPreview{white-space:pre-wrap}.filters{flex-wrap:wrap}.account-name{display:block;padding:0;border:0;background:none;text-align:left;color:#9dceff;font-weight:600}.account-meta{display:block;color:#a6b2c0;font-size:12px;margin-top:5px;line-height:1.6}.account-actions{min-width:180px;max-width:270px}.account-actions button{font-size:12px;min-height:32px;padding:5px 8px}#activityDialog{width:min(1000px,calc(100vw - 32px));max-width:1000px;max-height:88vh;padding:22px;box-sizing:border-box}.activity-title{display:flex;align-items:center;justify-content:space-between;gap:16px}.activity-title h2{margin:0}.activity-title button{flex:none}.activity-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.activity-facts>div,.activity-summary>div{background:#1d293a;border-radius:8px;padding:10px}.activity-facts small{display:block;color:#a6b2c0;margin-bottom:5px}.activity-summary{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.activity-paging{display:flex;gap:12px;align-items:center;margin-top:14px}#activityMessage{color:#ffcf87}.activity-feature{display:block;white-space:normal;min-width:160px}#activityIdentity{overflow-wrap:anywhere}@media(max-width:650px){.activity-facts{grid-template-columns:1fr 1fr}#activityDialog{padding:16px}.activity-summary>div{flex:1 1 100px}.filters label{flex:1 1 130px}}</style><link rel="stylesheet" href="/ui.css"></head><body>
<header><a class="ui-button ui-secondary" href="/">← 返回选车助手</a><h1>账号与公告管理</h1><p id="identity"></p><nav><button id="usersTab">全部账号</button><button id="newsTab">更新公告</button><a class="ui-button ui-secondary" href="/admin-access">管理员与邀请码</a></nav></header>
<main id="main" hidden><section id="users"><div class="filters"><label>邮箱或昵称搜索<input id="search" type="search" maxlength="254"></label><label>角色<select id="role"><option value="all">全部</option><option value="player">玩家</option><option value="admin">管理员</option><option value="superadmin">超级管理员</option></select></label><label>验证<select id="verified"><option value="all">全部</option><option value="yes">已验证</option><option value="no">待验证</option></select></label><label>状态<select id="status"><option value="all">全部</option><option value="active">正常</option><option value="disabled">停用</option></select></label><label id="activityFilter" hidden>活跃情况<select id="activity"><option value="all">全部</option><option value="today">今天有交互</option><option value="week">近7天有交互</option><option value="month">近30天有交互</option><option value="inactive">超过30天未交互</option><option value="never">尚无交互记录</option></select></label><label id="activityOrderFilter" hidden>排序<select id="activityOrder"><option value="interaction">最近交互优先</option><option value="visit">最近访问优先</option><option value="registered">最近注册优先</option></select></label><button id="query">查询</button></div><p id="count"></p><div class="table-wrap"><table><thead><tr><th>账号 / 昵称</th><th>角色 / 状态</th><th id="activityHeading">注册 / 最近登录</th><th>投稿</th><th>操作</th></tr></thead><tbody id="accounts"></tbody></table></div><button id="previous">上一页</button><button id="next">下一页</button></section>
<section id="news" hidden><h2>公告管理</h2><p>为一次功能更新发布一条公告。编辑原公告不会重置用户的“不再提醒”；重大新内容请新建公告。</p><select id="announcements" aria-label="选择公告"></select><button id="load">载入</button><button id="new">新建公告</button><label>标题<input id="title" maxlength="120"></label><label>功能版本标签<input id="release" maxlength="80" placeholder="例如：车库手动保存"></label><label>正文（纯文本）<textarea id="body" maxlength="6000"></textarea></label><div class="actions"><button id="preview">预览</button><button id="save">保存</button><button id="publish">发布公告</button><button id="withdraw">撤下公告</button></div><p id="newsState"></p><div id="announcementPreview"></div></section></main>
<dialog id="notice"><h2>操作提示</h2><p id="message"></p><button id="close">知道了</button></dialog><dialog id="confirm"><h2 id="question"></h2><label id="reasonLabel">操作原因<textarea id="reason" maxlength="200"></textarea></label><button id="cancel">取消</button><button id="yes">确认继续</button></dialog><dialog id="activityDialog" aria-labelledby="activityTitle"><div class="activity-title"><h2 id="activityTitle">账号访问与活跃</h2><button id="activityClose" type="button" aria-label="关闭账号活动">×</button></div><p id="activityIdentity" class="muted"></p><div id="activityFacts" class="activity-facts"></div><p class="muted">以上为账号全站最近记录；以下按所选日期与服别查看，每页10天，仅列有记录的日期。所有时间均为北京时间。</p><form id="activityForm" class="filters"><label>时间范围<select id="activityPeriod"><option value="7" selected>近7天</option><option value="30">近30天</option><option value="90">近90天</option><option value="custom">自选日期</option></select></label><label>开始日期<input id="activityStart" type="date" required></label><label>结束日期<input id="activityEnd" type="date" required></label><label>服别<select id="activityServer"><option value="all">全部服别（去重）</option><option value="cn">国服</option><option value="global">国际服</option></select></label><button type="submit">查询</button></form><p id="activityMessage" role="status"></p><div id="activitySummary" class="activity-summary"></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>访问次数</th><th>活跃分钟</th><th>功能使用</th></tr></thead><tbody id="activityRows"></tbody></table></div><div class="activity-paging"><button id="activityPrevious" type="button">上一页</button><span id="activityCount"></span><button id="activityNext" type="button">下一页</button></div><p class="muted">活跃分钟表示观察到操作的分钟，不是精确使用时长；没有记录不代表从未访问。</p></dialog></body></html>
