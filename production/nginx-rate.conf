# Put in /etc/nginx/conf.d/racepick-rate.conf (http context).
# Full-page server switches must not spend the API budget on scripts or data.
# Only GET/HEAD bootstrap reads are exempt; writes and other API routes retain
# the per-IP limit. Use a new zone name because its key differs from the old one.
map "$request_method:$uri" $racepick_api_limit_key {
    default $binary_remote_addr;
    "~^(GET|POST|DELETE):/api/map-recognition/(?:catalog|jobs(?:/[a-f0-9]{32})?)$" "";
    "~^(GET|POST|DELETE):/api/mini/v1/(?:session|snapshot|map-recognition/(?:catalog|jobs(?:/(?:by-request|[a-f0-9]{32}))?))$" "";
    "~^POST:/api/usage/(session|events)$" "";
    "~^(GET|HEAD):/(?!api(?:/|$))" "";
    "~^(GET|HEAD):/api/(?:scores/snapshot|auth/me|me/profile|announcements|me/announcement-preferences)$" "";
}
limit_req_zone $racepick_api_limit_key zone=racepick_api_requests:10m rate=5r/s;

# Usage traffic has its own budget and cannot exhaust account/submission limits.
map "$request_method:$uri" $racepick_usage_limit_key {
    default "";
    "~^POST:/api/usage/(session|events)$" $binary_remote_addr;
}
limit_req_zone $racepick_usage_limit_key zone=racepick_usage_events:10m rate=2r/s;

# OCR polling/uploads have their own IP budget; application also bounds uploads.
map "$request_method:$uri" $racepick_map_limit_key {
    default "";
    "~^(GET|POST|DELETE):/api/map-recognition/(?:catalog|jobs(?:/[a-f0-9]{32})?)$" $binary_remote_addr;
    "~^(GET|POST|DELETE):/api/mini/v1/(?:session|snapshot|map-recognition/(?:catalog|jobs(?:/(?:by-request|[a-f0-9]{32}))?))$" $binary_remote_addr;
}
limit_req_zone $racepick_map_limit_key zone=racepick_map_requests:10m rate=6r/s;
