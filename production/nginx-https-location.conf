# Install inside the EXISTING racepick.cn HTTPS server block only.
# Preserve its existing certificate settings and port-80 ACME/redirect configuration.
client_max_body_size 3m;
# Install together with the updated nginx-rate.conf before nginx -t/reload.
limit_req zone=racepick_api_requests burst=30 nodelay;
limit_req zone=racepick_usage_events burst=10 nodelay;
limit_req_status 429;
location / {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host racepick.cn;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
