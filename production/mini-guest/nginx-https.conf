# PREPARATION ONLY. Enable only AFTER the named certificate is issued and verified.
server {
    listen 443 ssl;
    server_name mini-test.racepick.cn;
    ssl_certificate /etc/letsencrypt/live/mini-test.racepick.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mini-test.racepick.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/racepick-mini-test-error.log warn;
    client_max_body_size 4k;
    client_body_timeout 5s;
    limit_req_status 429;
    location = /api/mini/v1/session {
        limit_except POST { deny all; }
        limit_req zone=racepick_mini_guest_requests burst=10 nodelay;
        include /etc/nginx/snippets/racepick-mini-test-proxy.conf;
    }
    location = /api/mini/v1/snapshot {
        limit_except GET { deny all; }
        limit_req zone=racepick_mini_guest_requests burst=10 nodelay;
        include /etc/nginx/snippets/racepick-mini-test-proxy.conf;
    }
    location / { return 404; }
}
