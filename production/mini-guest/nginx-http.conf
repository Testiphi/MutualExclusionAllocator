# PREPARATION ONLY. DNS/HTTP route/certificate issuance require separate authorization.
# Install this as its own site only after confirming the existing default server stays intact.
server {
    listen 80;
    server_name mini-test.racepick.cn;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/racepick-mini-test-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
